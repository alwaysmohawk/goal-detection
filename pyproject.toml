[project]
name = "goal-detection"
version = "0.1.0"
description = "HHOF Goalie Simulator — camera-based goal detection"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "websockets",
    # arena_api is not on PyPI — install manually from the Lucid Vision wheel:
    #   pip install "<Arena SDK install dir>\python\arena_api-*.whl"
    # install.ps1 does this automatically if the SDK is found.
]

[project.scripts]
goal-detector = "goal_detector:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
