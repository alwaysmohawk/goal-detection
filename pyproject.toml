[project]
name = "goal-detection"
version = "0.1.0"
description = "HHOF Goalie Simulator — camera-based goal detection"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "websockets",
    "arena_api",
]

[project.scripts]
goal-detector = "goal_detector:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
